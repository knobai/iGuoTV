name: Sign tvOS (Ad Hoc)

# 手动触发（main 分支）：复用 build_tvos.py 的未签名构建，加 Ad-Hoc 签名。
# 需要仓库级 Secrets：TVOS_CERTIFICATE_BASE64 / TVOS_CERTIFICATE_PASSWORD /
# TVOS_PROFILE_IGUOTV（证书与描述文件的 Base64，见 scripts/sign_tvos.py）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-sign-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  sign:
    if: github.repository == 'knobai/iGuoTV' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: iguotv
            arguments: ''
          - edition: iguotv-all-sources
            arguments: '--all-sources'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/native/go.mod
          cache: false

      # Upstream ships Hongguo as an embedded module. The tvOS standard edition
      # opens it by default and has no module installer in the UI.
      - name: Check out the bundled Hongguo module
        uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          ref: cdf8a24b83df522aeceff860b45f1cb2efa2f286
          path: bundled-modules/hongguo
          persist-credentials: false

      - name: Build unsigned tvOS packages
        env:
          BUNDLED_MODULES: ${{ github.workspace }}/bundled-modules/hongguo
        run: python scripts/build_tvos.py ${{ matrix.arguments }}

      - name: Fetch the Apple WWDR G3 intermediate
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          --output "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

      - name: Sign Ad Hoc
        env:
          TVOS_CERTIFICATE_BASE64: ${{ secrets.TVOS_CERTIFICATE_BASE64 }}
          TVOS_CERTIFICATE_PASSWORD: ${{ secrets.TVOS_CERTIFICATE_PASSWORD }}
          TVOS_PROFILE_IGUOTV: ${{ secrets.TVOS_PROFILE_IGUOTV }}
        run: |
          openssl_prefix=$(brew --prefix openssl@3)
          export PATH="$openssl_prefix/bin:$PATH"
          python scripts/sign_tvos.py --wwdr-certificate "$RUNNER_TEMP/AppleWWDRCAG3.cer"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-tvos-adhoc
          path: dist/tvos-sig/
          retention-days: 30
          if-no-files-found: error
